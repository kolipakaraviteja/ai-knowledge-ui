<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow" style="width: 100%; max-width: 400px;">
    <div class="card-body p-5">
      <h2 class="card-title text-center mb-4">Knowledge Assistant</h2>
      <p class="text-center text-muted mb-4">Create your account</p>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            formControlName="email"
            placeholder="Enter email"
            [class.is-invalid]="email?.invalid && email?.touched"
          />
          <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            formControlName="username"
            placeholder="Enter username"
            [class.is-invalid]="username?.invalid && username?.touched"
          />
          <div class="invalid-feedback" *ngIf="username?.invalid && username?.touched">
            <span *ngIf="username?.errors?.['required']">Username is required</span>
            <span *ngIf="username?.errors?.['minlength']">Username must be at least 3 characters</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            formControlName="password"
            placeholder="Enter password"
            [class.is-invalid]="password?.invalid && password?.touched"
          />
          <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
            <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ errorMessage }}
          <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="registerForm.invalid || isLoading"
        >
          <span *ngIf="!isLoading">Register</span>
          <span *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Registering...
          </span>
        </button>
      </form>

      <hr class="my-4" />

      <div class="text-center">
        <p class="text-muted small mb-2">Already have an account?</p>
        <a routerLink="/login" class="btn btn-outline-primary btn-sm">Sign In</a>
      </div>
    </div>
  </div>
</div>
